name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: signalops_ci_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d signalops_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check

      - name: Exercise PostgreSQL migrations and RPCs
        env:
          SIGNALOPS_POSTGRES_TEST_CONFIRM: signalops_ci_test
          SIGNALOPS_POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/signalops_ci_test
        run: pnpm test:postgres:v1
